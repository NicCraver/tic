name: Tic
options:
  bundleIdPrefix: me.nic
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.35"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH_Release: "NO"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: targeted

packages:
  LunarSwift:
    url: https://github.com/6tail/lunar-swift
    from: "1.1.8"

targets:
  Tic:
    type: application
    platform: macOS
    sources:
      - path: Tic/Sources
      - path: Tic/Assets.xcassets
      - path: Tic/Resources/holidays
    info:
      path: Tic/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.nic.tic
        CODE_SIGN_ENTITLEMENTS: Tic/Resources/Tic.entitlements
        PRODUCT_NAME: Tic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LunarSwift
    entitlements:
      path: Tic/Resources/Tic.entitlements

  TicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TicTests
    dependencies:
      - target: Tic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tic.app/Contents/MacOS/Tic
