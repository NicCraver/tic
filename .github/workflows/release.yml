name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        run: |
          xcodebuild build \
            -scheme Tic \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Ad-hoc sign app bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Tic.app"
          test -d "$APP_PATH"
          # 整包 ad-hoc 签名，减轻 Gatekeeper 对「已损坏」的误报（仍需用户处理隔离属性）
          codesign --sign - --force --deep --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Create DMG
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Tic.app"
          chmod +x scripts/make-release-dmg.sh
          scripts/make-release-dmg.sh \
            "$APP_PATH" \
            "Tic-${GITHUB_REF_NAME}-macOS.dmg" \
            "Tic"

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^\#\# \[/ {
              if ($0 ~ "\\[" ver "\\]") { show=1; next }
              if (show) exit
            }
            show && /^## \[/ { exit }
            show { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for version ${GITHUB_REF_NAME}." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tic-${{ github.ref_name }}-macOS.dmg
          body_path: release-notes.md
          generate_release_notes: false
